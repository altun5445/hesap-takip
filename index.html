                        <div class="text-gray-500">Ara Toplam: <span class="font-medium text-gray-800 dark:text-gray-200 w-32 inline-block text-right">${parseFloat(t.araToplam || 0).toLocaleString('tr-TR')} ${pbGenel}</span></div>
                        <div class="text-gray-500">KDV Toplam (%${kdvOraniGosterim}): <span class="font-medium text-gray-800 dark:text-gray-200 w-32 inline-block text-right">${parseFloat(t.kdvToplam || 0).toLocaleString('tr-TR')} ${pbGenel}</span></div>
                        <div class="text-2xl font-black text-brand mt-2 pt-2 border-t dark:border-slate-700">Genel Toplam: <span class="w-32 inline-block text-right">${parseFloat(t.genelToplam || 0).toLocaleString('tr-TR')} ${pbGenel}</span></div>
                    </div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
        }

        function openTeklifModal(teklifId = null) {
            const t = teklifId ? db.teklifler.find(x => x.id === teklifId) : null;
            showModal(`
                <h3 class="text-2xl font-bold mb-6 border-b dark:border-slate-700 pb-2">${teklifId ? 'Teklifi Düzenle' : 'Yeni Teklif Oluştur'}</h3>
                <div class="space-y-4">
                    <input type="text" id="t_mus" value="${t ? t.musteri : ''}" placeholder="Müşteri/Firma Adı (Zorunlu)" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors font-bold text-lg">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <input type="text" id="t_yet" value="${t ? (t.yetkili || '') : ''}" placeholder="Yetkili Kişi" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors">
                        <input type="text" id="t_tel" value="${t ? (t.tel || '') : ''}" placeholder="Telefon Numarası" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors">
                    </div>
                    <textarea id="t_adres" placeholder="Firma Adresi" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors h-20">${t ? (t.adres || '') : ''}</textarea>
                    
                    <div class="border-t dark:border-slate-700 pt-4 mt-2">
                        <div class="flex justify-between items-center mb-3">
                            <span class="font-bold text-sm text-gray-500">Özel Alanlar (Sağ sütunda yer alır)</span>
                            <button onclick="addTeklifAlan()" class="text-brand text-sm font-bold bg-blue-50 hover:bg-blue-100 dark:bg-slate-800 dark:hover:bg-slate-700 px-3 py-1.5 rounded-lg transition-colors">+ Alan Ekle</button>
                        </div>
                        <div id="ekstraAlanlarContainer" class="space-y-2 max-h-40 overflow-y-auto pr-1"></div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-3 pt-4 border-t dark:border-slate-700 mt-4">
                        <button onclick="closeModal()" class="w-full sm:w-auto bg-gray-200 dark:bg-slate-700 py-3 px-6 rounded-xl font-bold hover:bg-gray-300 transition-colors order-3 sm:order-1">İptal</button>
                        <button onclick="saveTeklifSablon()" class="flex-1 bg-indigo-500 text-white py-3 rounded-xl font-bold hover:bg-indigo-600 transition-colors order-2 sm:order-2" title="Eklenen başlıkları kalıcı şablon olarak kaydeder">Şablonu Kaydet</button>
                        <button onclick="saveTeklif('${teklifId || ''}')" class="flex-1 bg-brand text-white py-3 rounded-xl font-bold hover:bg-blue-600 transition-colors order-1 sm:order-3">${teklifId ? 'Güncelle' : 'Teklifi Oluştur'}</button>
                    </div>
                </div>
            `);
            
            if (t && t.ekstraBarlar && t.ekstraBarlar.length > 0) {
                t.ekstraBarlar.forEach(b => addTeklifAlan(b.baslik, b.deger));
            } else if (db.settings.teklifSabitAlanlar && db.settings.teklifSabitAlanlar.length > 0) {
                db.settings.teklifSabitAlanlar.forEach(baslik => addTeklifAlan(baslik));
            }
        }

        function addTeklifAlan(baslik = '', deger = '') {
            const container = document.getElementById('ekstraAlanlarContainer');
            const div = document.createElement('div');
            div.className = "flex flex-col sm:flex-row gap-2 ekstra-alan-row animate-[fadeIn_0.2s_ease-out]";
            div.innerHTML = `
                <input type="text" value="${baslik}" placeholder="Başlık" class="w-full sm:w-1/3 p-2.5 rounded-lg bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none text-sm focus:ring-2 focus:ring-brand transition-colors ekstra-baslik font-semibold">
                <input type="text" value="${deger}" placeholder="Değer" class="w-full sm:flex-1 p-2.5 rounded-lg bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none text-sm focus:ring-2 focus:ring-brand transition-colors ekstra-deger">
                <button onclick="this.parentElement.remove()" class="bg-red-50 hover:bg-red-100 dark:bg-slate-800 text-red-500 px-3 py-2 sm:py-0 rounded-lg font-bold transition-colors text-center" title="Alanı Sil">Sil</button>
            `;
            container.appendChild(div);
            if(!baslik) div.querySelector('.ekstra-baslik').focus();
        }

        function saveTeklifSablon() {
            const sabitAlanlar = [];
            document.querySelectorAll('.ekstra-alan-row').forEach(row => {
                const baslik = row.querySelector('.ekstra-baslik').value.trim();
                if(baslik && !sabitAlanlar.includes(baslik)) sabitAlanlar.push(baslik);
            });
            db.settings.teklifSabitAlanlar = sabitAlanlar;
            saveDB().then(() => showToast('Başarılı', 'Şablon kaydedildi.', 'success'));
        }

        function saveTeklif(teklifId = '') {
            const m = document.getElementById('t_mus').value.trim();
            if(!m) { 
                showToast('Uyarı', 'Müşteri adı zorunludur!', 'error'); 
                return; 
            }
            
            const isDuplicate = (db.teklifler || []).some(x => x.musteri.toLowerCase() === m.toLowerCase() && x.id !== teklifId);
            if(isDuplicate) { 
                showToast('Uyarı', 'Bu firmaya ait bir teklif dosyası zaten var.', 'error'); 
                return; 
            }
            
            const ekstraBarlar = [];
            document.querySelectorAll('.ekstra-alan-row').forEach(row => {
                const baslik = row.querySelector('.ekstra-baslik').value.trim();
                const deger = row.querySelector('.ekstra-deger').value.trim();
                if(baslik && deger) ekstraBarlar.push({ baslik, deger });
            });

            if (teklifId) {
                const t = db.teklifler.find(x => x.id === teklifId);
                if (t) {
                    t.musteri = m;
                    t.yetkili = document.getElementById('t_yet').value.trim();
                    t.tel = document.getElementById('t_tel').value.trim();
                    t.adres = document.getElementById('t_adres').value.trim();
                    t.ekstraBarlar = ekstraBarlar;
                }
                closeModal(); 
                saveDB(); 
                renderTeklifDetail(teklifId);
                showToast('Başarılı', 'Teklif güncellendi.', 'success');
            } else {
                const t = { 
                    id: Date.now().toString(), 
                    tarih: new Date().toLocaleDateString('tr-TR'),
                    musteri: m, 
                    yetkili: document.getElementById('t_yet').value.trim(),
                    tel: document.getElementById('t_tel').value.trim(),
                    adres: document.getElementById('t_adres').value.trim(),
                    ekstraBarlar: ekstraBarlar, 
                    islemler: [], 
                    araToplam: 0, 
                    kdvToplam: 0, 
                    genelToplam: 0
                };
                
                if(!db.teklifler) db.teklifler = []; 
                db.teklifler.push(t);
                
                closeModal(); 
                saveDB(); 
                nav('teklifler');
                showToast('Başarılı', 'Teklif oluşturuldu.', 'success');
            }
        }

        function openTeklifKalemModal(tId, index = null) {
            const t = db.teklifler.find(x => x.id === tId);
            let kdv = db.settings.kdvActive.teklif !== false ? db.settings.kdvDefault : 0;
            let aciklama = '', miktar = 1, birim = 'Adet', birimFiyat = '', islemKdv = kdv;
            
            let pb = sonParaBirimi;
            if (index !== null) {
                const islem = t.islemler[index];
                aciklama = islem.aciklama;
                miktar = islem.miktar || 1;
                birim = islem.birim || 'Adet';
                birimFiyat = islem.birimFiyat;
                islemKdv = islem.kdv;
                pb = islem.paraBirimi || '₺';
            }

            showModal(`
                <h3 class="text-xl font-bold mb-4 border-b dark:border-slate-700 pb-2">${index !== null ? 'Teklif Kalemini Düzenle' : 'Teklife Kalem Ekle'}</h3>
                <div class="space-y-4">
                    <input type="text" id="tk_aciklama" value="${aciklama}" placeholder="Ürün/Hizmet Açıklaması" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors font-bold text-gray-800 dark:text-white">
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <div>
                            <label class="text-xs text-gray-500 mb-1 block">Miktar</label>
                            <input type="number" id="tk_miktar" value="${miktar}" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors text-center font-bold text-gray-800 dark:text-white">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 mb-1 block">Birim</label>
                            <input type="text" id="tk_birim" value="${birim}" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors text-center text-gray-800 dark:text-white">
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-xs text-gray-500 mb-1 block">Fiyat / Birim</label>
                            <div class="flex gap-1">
                                <input type="number" id="tk_birim_fiyat" value="${birimFiyat}" placeholder="0.00" class="w-2/3 p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors font-bold text-brand">
                                <select id="tk_para_birimi" class="w-1/3 p-2 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 font-bold focus:ring-2 focus:ring-brand outline-none text-center">
                                    <option value="₺" ${pb === '₺' ? 'selected' : ''}>₺</option>
                                    <option value="$" ${pb === '$' ? 'selected' : ''}>$</option>
                                    <option value="€" ${pb === '€' ? 'selected' : ''}>€</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-xs text-gray-500 mb-1 block">% KDV</label>
                            <input type="number" id="tk_kdv" value="${islemKdv}" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors text-center text-gray-800 dark:text-white" ${kdv===0 && index===null ? 'disabled':''}>
                        </div>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-3 pt-4 border-t dark:border-slate-700">
                        <button onclick="closeModal()" class="w-full sm:flex-1 bg-gray-200 dark:bg-slate-700 py-3 rounded-xl font-bold text-gray-800 dark:text-white order-2 sm:order-1">İptal</button>
                        <button onclick="saveTeklifKalem('${tId}', ${index})" class="w-full sm:flex-1 bg-brand text-white py-3 rounded-xl font-bold order-1 sm:order-2">${index !== null ? 'Değişiklikleri Kaydet' : 'Ekle'}</button>
                    </div>
                </div>
            `);
        }
        
        function saveTeklifKalem(tId, index) {
            const t = db.teklifler.find(x => x.id === tId);
            const a = document.getElementById('tk_aciklama').value.trim();
            if(!a) { 
                showToast('Uyarı', 'Lütfen bir açıklama giriniz.', 'error'); 
                return; 
            }

            const m = parseFloat(document.getElementById('tk_miktar').value)||1;
            const b = document.getElementById('tk_birim').value.trim()||'Adet';
            const bf = parseFloat(document.getElementById('tk_birim_fiyat').value)||0;
            const kdv = parseFloat(document.getElementById('tk_kdv').value)||0;
            const paraBirimi = document.getElementById('tk_para_birimi').value;
            
            sonParaBirimi = paraBirimi;

            const araTop = bf * m;
            const kdvTutari = (araTop * kdv) / 100;
            const toplam = araTop + kdvTutari;

            const yeniIslem = { 
                aciklama: a, 
                miktar: m, 
                birim: b, 
                birimFiyat: bf, 
                kdv: kdv, 
                araToplam: araTop, 
                toplam: toplam,
                paraBirimi: paraBirimi
            };

            if (index !== null && index !== undefined) {
                t.islemler[index] = yeniIslem;
            } else {
                t.islemler.push(yeniIslem);
            }
            
            t.araToplam = t.islemler.reduce((sum, i) => sum + (i.araToplam || (i.birimFiyat * (i.miktar||1))), 0);
            t.kdvToplam = t.islemler.reduce((sum, i) => sum + ((i.araToplam || (i.birimFiyat * (i.miktar||1))) * i.kdv / 100), 0);
            t.genelToplam = t.araToplam + t.kdvToplam;
            
            closeModal(); 
            saveDB(); 
            renderTeklifDetail(tId);
            showToast('Başarılı', 'Kalem eklendi.', 'success');
        }

        function deleteTeklifKalem(tId, index) {
            showCustomConfirm('Kalemi Sil', 'Bu kalemi silmek istediğinize emin misiniz?', () => {
                const t = db.teklifler.find(x => x.id === tId);
                t.islemler.splice(index, 1);
                t.araToplam = t.islemler.reduce((sum, i) => sum + (i.araToplam || (i.birimFiyat * (i.miktar||1))), 0);
                t.kdvToplam = t.islemler.reduce((sum, i) => sum + ((i.araToplam || (i.birimFiyat * (i.miktar||1))) * i.kdv / 100), 0);
                t.genelToplam = t.araToplam + t.kdvToplam;
                saveDB(); 
                renderTeklifDetail(tId);
                showToast('Bilgi', 'Kalem silindi.', 'info');
            });
        }

        function deleteTeklif(id) {
            showCustomConfirm('Teklifi Sil', 'Bu teklifi tamamen silmek istediğinize emin misiniz?', () => {
                db.teklifler = db.teklifler.filter(x => x.id !== id); 
                saveDB(); 
                nav('teklifler');
                showToast('Bilgi', 'Teklif silindi.', 'info');
            });
        }

        // --- NOTLAR MODÜLÜ ---
        function renderNotlar(container) {
            const data = db.notlar || [];
            let html = `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Notlar</h2>
                    <button onclick="openNotModal()" class="bg-brand text-white px-6 py-3 rounded-xl font-bold shadow-md hover:bg-blue-600">+ Yeni Not</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            `;
            
            if(data.length === 0) {
                container.innerHTML = html + `</div><div class="text-center py-10 text-gray-500">Not bulunamadı.</div>`;
                return;
            }
            
            data.forEach(n => {
                html += `
                    <div class="bg-[#fef3c7] dark:bg-yellow-900/40 text-gray-800 dark:text-gray-100 p-6 rounded-2xl shadow-sm relative group hover:shadow-md transition-shadow">
                        <div class="text-xs text-yellow-700 dark:text-yellow-500 mb-2 font-bold">${n.tarih}</div>
                        <h3 class="font-bold text-xl mb-3 border-b border-yellow-200 dark:border-yellow-700/50 pb-2">${n.baslik}</h3>
                        <p class="whitespace-pre-wrap text-sm leading-relaxed break-words">${n.icerik}</p>
                        <button onclick="deleteNot('${n.id}')" class="absolute top-4 right-4 text-red-500 bg-red-100 dark:bg-red-900/50 w-8 h-8 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity" title="Sil">🗑️</button>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function openNotModal() {
            showModal(`
                <h3 class="text-xl font-bold mb-4 border-b dark:border-slate-700 pb-2">Not Ekle</h3>
                <div class="space-y-4">
                    <input type="text" id="n_bas" placeholder="Not Başlığı" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors font-bold">
                    <textarea id="n_ic" placeholder="Not içerik detayları..." class="w-full p-3 h-40 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors"></textarea>
                    <div class="flex flex-col sm:flex-row gap-3 pt-4 border-t dark:border-slate-700">
                        <button onclick="closeModal()" class="w-full sm:flex-1 bg-gray-200 dark:bg-slate-700 py-3 rounded-xl font-bold order-2 sm:order-1">İptal</button>
                        <button onclick="saveNot()" class="w-full sm:flex-1 bg-brand text-white py-3 rounded-xl font-bold order-1 sm:order-2">Kaydet</button>
                    </div>
                </div>
            `);
        }

        function saveNot() {
            db.notlar.push({ 
                id: Date.now().toString(), 
                tarih: new Date().toLocaleDateString('tr-TR'), 
                baslik: document.getElementById('n_bas').value, 
                icerik: document.getElementById('n_ic').value 
            });
            closeModal(); 
            saveDB(); 
            renderNotlar(document.getElementById('mainContent'));
            showToast('Başarılı', 'Not eklendi.', 'success');
        }

        function deleteNot(id) { 
            showCustomConfirm('Notu Sil', 'Notu silmek istediğinize emin misiniz?', () => {
                db.notlar = db.notlar.filter(x=>x.id!==id); 
                saveDB(); 
                renderNotlar(document.getElementById('mainContent')); 
                showToast('Bilgi', 'Not silindi.', 'info');
            });
        }

        // --- AYARLAR MODÜLÜ VE ŞİRKET BİLGİLERİ ---

        function encodeLogo(input) {
            if (input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => { 
                    db.settings.logo = e.target.result; 
                    document.getElementById('logoPreview').src = e.target.result; 
                    document.getElementById('logoPreview').classList.remove('hidden'); 
                    document.getElementById('logoPreview').nextElementSibling.classList.add('hidden'); 
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        function removeLogo() { 
            db.settings.logo = ''; 
            updateLogoView(); 
            updateManifest(); 
            nav('ayarlar'); 
            saveDB().then(()=>showToast('Başarılı', 'Logo silindi.', 'success')); 
        }

        function encodeImzaLogo(input) {
            if (input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => { 
                    if(!db.settings.sirketBilgileri) db.settings.sirketBilgileri = {};
                    db.settings.sirketBilgileri.imzaLogo = e.target.result; 
                    document.getElementById('imzaPreview').src = e.target.result; 
                    document.getElementById('imzaPreview').classList.remove('hidden'); 
                    document.getElementById('imzaPreview').nextElementSibling.classList.add('hidden'); 
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

            db.settings.user = document.getElementById('setU').value || db.settings.user;

            db.settings.kdvDefault = parseFloat(document.getElementById('setKdvDef').value) || 20;
            
            db.settings.sirketBilgileri = {

        // --- PDF İŞLEMLERİ ---
        async function loadCustomFont(doc) {
            try {
                if(!fontRegularBase64) { 
                    const r = await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/fonts/Roboto/Roboto-Regular.ttf'); 
                    const b = await r.arrayBuffer(); 
                    let s=''; 
                    const u=new Uint8Array(b); 
                    for(let i=0;i<u.byteLength;i++)s+=String.fromCharCode(u[i]); 
                    fontRegularBase64=window.btoa(s); 
                }
                if(!fontBoldBase64) { 
                    const r = await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/fonts/Roboto/Roboto-Medium.ttf'); 
                    const b = await r.arrayBuffer(); 
                    let s=''; 
                    const u=new Uint8Array(b); 
                    for(let i=0;i<u.byteLength;i++)s+=String.fromCharCode(u[i]); 
                    fontBoldBase64=window.btoa(s); 
                }
                doc.addFileToVFS('Roboto-Regular.ttf', fontRegularBase64); 
                doc.addFont('Roboto-Regular.ttf', 'Roboto', 'normal'); 
                doc.addFileToVFS('Roboto-Medium.ttf', fontBoldBase64); 
                doc.addFont('Roboto-Medium.ttf', 'Roboto', 'bold'); 
                return true;
            } catch(e) { return false; }
        }

        function injectPdfHeader(doc, title) {
            if (db.settings.logo) {
                try { 
                    doc.addImage(db.settings.logo, 'JPEG', 10, 15, 22.5, 9.9); 
                } catch (e) {}
            }
            doc.setFont("Roboto", "bold"); 
            doc.setFontSize(15); 
            doc.text(title, 105, 20, { align: 'center' });
            
            doc.setFont("Roboto", "normal"); 
            doc.setFontSize(9); 
            doc.text(`Tarih: ${new Date().toLocaleDateString('tr-TR')}`, 196, 12, { align: 'right' });
            
            return 38;
        }

        async function exportIslemlerPDF(type, id, btn) {
            if(btn) { btn.innerText = "Hazırlanıyor..."; btn.disabled = true; }
            
            const c = db[type].find(x => x.id === id); 
            const doc = new window.jspdf.jsPDF(); 
            const hasFont = await loadCustomFont(doc);
            const f = hasFont ? "Roboto" : "helvetica";
            
            let sY = injectPdfHeader(doc, `${c.isim} - Hesap Ekstresi`);
            const td = []; 
            let tNet = 0, tKdv = 0, tBorc = 0, tOdenen = 0, tAlinan = 0, tVerilen = 0, kTopOrtaklik = 0;
            
            (c.islemler || []).forEach(i => {
                let st = i.durum; 
                const tutar = parseFloat(i.toplam) || 0; 
                let aTop = parseFloat(i.araToplam);
                let kdvOrn = parseFloat(i.kdv) || 0;

                if (isNaN(aTop)) {
                    aTop = tutar / (1 + (kdvOrn / 100));
                }
                let kdvTutar = tutar - aTop;
                
                let birimF = parseFloat(i.net);
                if(isNaN(birimF)) birimF = aTop / (parseFloat(i.miktar) || 1);

                if (type === 'ortaklik') { 
                    st = i.ortakTipi; 
                    if(st==='Alınan') tAlinan += tutar; 
                    if(st==='Verilen') tVerilen += tutar; 
                    kTopOrtaklik += kdvTutar;
                    
                    td.push([
                        i.tarih, 
                        i.aciklama, 
                        i.miktar ? `${i.miktar} ${i.birim}` : '-', 
                        st, 
                        tutar.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' TL'
                    ]);
                } else { 
                    if (st === 'Ödenmedi') { 
                        st = 'Ödenmedi'; 
                        tNet += aTop;
                        tKdv += kdvTutar;
                        tBorc += tutar; 
                    } else if (st === 'Ödendi') { 
                        tOdenen += tutar; 
                    } 
                    
                    let durumYazi = st === 'Ödenmedi' ? 'Ödenmedi' : (st === 'Ödendi' ? 'Ödendi\n(' + (i.odemeTuru || 'Nakit') + ')' : st);

                    td.push([
                        i.tarih, 
                        i.aciklama, 
                        i.miktar ? `${i.miktar} ${i.birim}` : '-', 
                        birimF.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' TL', 
                        kdvTutar.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' TL',
                        tutar.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' TL',
                        durumYazi
                    ]);
                }
            });

            const headColumns = type === 'ortaklik' 
                ? [['Tarih', 'Açıklama', 'Miktar', 'Durum', 'Tutar']]
                : [['Tarih', 'Açıklama', 'Miktar', 'Birim Fiyat', `KDV Tutarı (%${db.settings.kdvDefault})`, 'Genel Toplam', 'Durum']];

            doc.autoTable({ 
                startY: sY, 
                head: headColumns, 
                body: td, 
                theme: 'striped', 
                headStyles: { fillColor: [59, 130, 246], font: f, fontStyle: 'bold' }, 
                columnStyles: type === 'ortaklik' 
                    ? { 0: { cellWidth: 24 }, 1: { cellWidth: 'auto' }, 2: { cellWidth: 20 }, 3: { cellWidth: 30 }, 4: { cellWidth: 35, halign: 'right' } }
                    : { 0: { cellWidth: 20 }, 1: { cellWidth: 'auto' }, 2: { cellWidth: 16 }, 3: { cellWidth: 22, halign: 'right' }, 4: { cellWidth: 24, halign: 'right' }, 5: { cellWidth: 26, halign: 'right' }, 6: { cellWidth: 24, halign: 'center' } }, 
                styles: { font: f, fontSize: 9, overflow: 'linebreak', cellPadding: 3, valign: 'middle' } 
            });

            let fY = doc.lastAutoTable.finalY || 50; 
            doc.setFontSize(10); 
            doc.setFont(f, "bold");

            if (type === 'ortaklik') {
                doc.text(`KDV Toplam (%${db.settings.kdvDefault}):`, 155, fY + 10, { align: 'right' }); 
                doc.text(`${kTopOrtaklik.toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2})} TL`, 195, fY + 10, { align: 'right' });
                
                doc.text(`Toplam Alınan:`, 155, fY + 16, { align: 'right' }); 
                doc.text(`${tAlinan.toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2})} TL`, 195, fY + 16, { align: 'right' });
                
                doc.text(`Toplam Verilen:`, 155, fY + 22, { align: 'right' }); 
                doc.text(`${tVerilen.toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2})} TL`, 195, fY + 22, { align: 'right' });
                
                doc.text(tAlinan > tVerilen ? "Net Durum (Alacaklı):" : (tVerilen > tAlinan ? "Net Durum (Borçlu):" : "Net Durum (Eşit):"), 155, fY + 28, { align: 'right' }); 
                doc.text(`${Math.abs(tAlinan - tVerilen).toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2})} TL`, 195, fY + 28, { align: 'right' });
            } else {
                doc.text(`Net Toplam:`, 155, fY + 10, { align: 'right' }); 
                doc.text(`${tNet.toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2})} TL`, 195, fY + 10, { align: 'right' });
                
                doc.text(`KDV Toplam (%${db.settings.kdvDefault}):`, 155, fY + 16, { align: 'right' }); 
                doc.text(`${tKdv.toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2})} TL`, 195, fY + 16, { align: 'right' });
                
                doc.text(`Genel Toplam (KDV Dahil):`, 155, fY + 22, { align: 'right' }); 
                doc.text(`${tBorc.toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2})} TL`, 195, fY + 22, { align: 'right' });
                
                doc.text(`Toplam Ödenen:`, 155, fY + 28, { align: 'right' }); 
                doc.text(`${tOdenen.toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2})} TL`, 195, fY + 28, { align: 'right' });

                doc.text(`Kalan Bakiye:`, 155, fY + 34, { align: 'right' }); 
                doc.text(`${(tBorc - tOdenen).toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2})} TL`, 195, fY + 34, { align: 'right' });
            }

            doc.save(`${c.isim}_ekstre.pdf`); 
            if(btn) { btn.innerText = "PDF Çıktısı"; btn.disabled = false; } 
            showToast('Başarılı', 'PDF indirildi.', 'success');
        }

            doc.text('TEKLİF FORMU', 105, currentY, { align: 'center' });
            
            currentY += 10;
            doc.setFontSize(9); 
            doc.setFont(f, "normal");
            doc.text(`Tarih: ${t.tarih || new Date().toLocaleDateString('tr-TR')}`, 196, currentY, { align: 'right' });
            currentY += 10;

            doc.setFontSize(11); 
            doc.setFont(f, "bold"); 
            doc.text(`Müşteri:`, 14, currentY); 
            doc.setFont(f, "normal"); 
            doc.text(`${t.musteri}`, 34, currentY); 
            
            doc.setFont(f, "bold"); 
            doc.text(`Yetkili:`, 14, currentY + 7); 
            doc.setFont(f, "normal"); 
            doc.text(`${t.yetkili || '-'}`, 34, currentY + 7); 
            
            let lY = currentY + 14; 
            doc.setFont(f, "bold"); doc.text(`Telefon:`, 14, lY); 
            doc.setFont(f, "normal"); doc.text(`${t.tel || '-'}`, 34, lY); 
            lY += 7; 
            
            doc.setFont(f, "bold"); doc.text(`Adres:`, 14, lY); 
            doc.setFont(f, "normal"); 
            let sA = doc.splitTextToSize(t.adres || '-', 80); 
            doc.text(sA, 34, lY); 
            lY += (sA.length * 5);
            
            let rY = currentY; 
            (t.ekstraBarlar || []).forEach(bar => { 
                doc.setFont(f, "bold"); 
                doc.text(`${bar.baslik}:`, 115, rY); 
                doc.setFont(f, "normal"); 
                let sV = doc.splitTextToSize(bar.deger, 60); 
                doc.text(sV, 140, rY); 
                rY += (sV.length * 5); 
            });
            
            let cY = Math.max(lY, rY) + 5; 
            
            const td = []; 
            let pbGenel = '₺';
            (t.islemler||[]).forEach((i, idx) => { 
                let pb = i.paraBirimi || '₺';
                if(idx === t.islemler.length - 1) pbGenel = pb;
                
                let bFiyat = parseFloat(i.birimFiyat) || 0;
                let kdvO = parseFloat(i.kdv) || 0;
                let miktar = parseFloat(i.miktar) || 1;
                let kdvTutari = (bFiyat * miktar * kdvO) / 100;
                let toplamTutar = parseFloat(i.toplam) || 0;

                td.push([
                    i.aciklama, 
                    i.miktar ? `${i.miktar} ${i.birim}` : '-', 
                    `${bFiyat.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2})} ${pb}`, 
                    `${kdvTutari.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2})} ${pb}`,
                    `${toplamTutar.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2})} ${pb}`
                ]); 
            });
            
            doc.autoTable({ 
                startY: cY, 
                head: [['Açıklama', 'Miktar', 'Birim Fiyat', `KDV Tutarı (%${db.settings.kdvDefault})`, 'Tutar']], 
                body: td, 
                theme: 'grid', 
                headStyles: { fillColor: [59, 130, 246], font: f, fontStyle: 'bold' }, 
                columnStyles: { 0: { cellWidth: 'auto' }, 1: { cellWidth: 20 }, 2: { cellWidth: 30, halign: 'right' }, 3: { cellWidth: 30, halign: 'right' }, 4: { cellWidth: 35, halign: 'right' } }, 
                styles: { font: f, fontSize: 9, overflow: 'linebreak', cellPadding: 3, valign: 'middle' } 
            });
            
            let fY = doc.lastAutoTable.finalY || (cY + 15); 
            doc.setFontSize(10); 
            doc.setFont(f, "bold");
            
            doc.text(`Ara Toplam:`, 155, fY + 10, { align: 'right' }); 
            doc.text(`${parseFloat(t.araToplam).toLocaleString('tr-TR',{minimumFractionDigits:2})} ${pbGenel}`, 195, fY + 10, { align: 'right' });
            
            doc.text(`KDV Toplam (%${db.settings.kdvDefault}):`, 155, fY + 16, { align: 'right' }); 
            doc.text(`${parseFloat(t.kdvToplam).toLocaleString('tr-TR',{minimumFractionDigits:2})} ${pbGenel}`, 195, fY + 16, { align: 'right' });
            
            doc.text(`Genel Toplam:`, 155, fY + 24, { align: 'right' }); 
            doc.text(`${parseFloat(t.genelToplam).toLocaleString('tr-TR',{minimumFractionDigits:2})} ${pbGenel}`, 195, fY + 24, { align: 'right' });

            let footerY = fY + 45;
            
            if(footerY > 270) { 
                doc.addPage(); 
                footerY = 20; 
            }
            
            doc.setFontSize(11); 
            doc.setFont(f, "bold");
            doc.text('Teklif Veren', 45, footerY, { align: 'center' });
            doc.text('Teklif Alan', 165, footerY, { align: 'center' });
            
            doc.setFontSize(10); 
            doc.setFont(f, "normal");
            doc.text('Ad Soyad / İmza', 45, footerY + 6, { align: 'center' });
            doc.text('Ad Soyad / İmza', 165, footerY + 6, { align: 'center' });

            let sirketYetkili = (db.settings.sirketBilgileri && db.settings.sirketBilgileri.yetkili) ? db.settings.sirketBilgileri.yetkili : '';
            let imzaLogo = (db.settings.sirketBilgileri && db.settings.sirketBilgileri.imzaLogo) ? db.settings.sirketBilgileri.imzaLogo : null;

            if (sirketYetkili) {
                doc.setFont(f, "bold");
                doc.text(sirketYetkili, 45, footerY + 14, { align: 'center' });
            }

            if (imzaLogo) {
                try { 
                    doc.addImage(imzaLogo, 'PNG', 30, footerY + 16, 30, 15); 
                } catch(e) {}
            }
            
            doc.save(`Teklif_${t.musteri}.pdf`); 
            if(btn) { btn.innerText = "PDF Çıktısı"; btn.disabled = false; } 
            showToast('Başarılı', 'Teklif PDF olarak indirildi.', 'success');
        }
    </script>
</body>
</html>
