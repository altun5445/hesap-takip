<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altun Hesap Takip</title>
    
    <!-- MASAÜSTÜ UYGULAMA MİMARİSİ (PWA) -->
    <link id="dynamicManifest" rel="manifest" href="">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Altun Hesap Takip">
    <meta name="theme-color" content="#3b82f6">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- jsPDF ve AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#3b82f6',
                        darkBg: '#0f172a',
                        cardDark: '#1e293b'
                    }
                }
            }
        }
    </script>
    
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        body { user-select: none; }
        input, textarea, select { user-select: auto; }
        .modal-open { overflow: hidden; }
        
        .custom-logo-container {
            width: 150px;
            height: 75px;
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        .custom-logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-darkBg text-gray-800 dark:text-gray-100 transition-colors h-screen flex overflow-hidden">

    <!-- BİLDİRİM PENCERESİ (TOAST) -->
    <div id="appToast" class="fixed top-20 right-6 z-[90] transform translate-x-full opacity-0 transition-all duration-300 bg-white dark:bg-cardDark border dark:border-slate-700 shadow-2xl rounded-2xl p-4 flex items-center gap-3 min-w-[280px] max-w-sm pointer-events-none">
        <div id="toastIcon" class="text-2xl">ℹ️</div>
        <div class="flex-1">
            <h4 id="toastTitle" class="font-bold text-sm">Bildirim</h4>
            <p id="toastMessage" class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">İşlem gerçekleştirildi.</p>
        </div>
    </div>

    <!-- LOGIN EKRANI -->
    <div id="loginView" class="fixed inset-0 bg-gray-100 dark:bg-darkBg z-[70] flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white dark:bg-cardDark p-8 rounded-2xl shadow-xl w-full max-w-sm border border-gray-200 dark:border-slate-700">
            <div class="text-center mb-6 flex flex-col items-center justify-center">
                <div id="loginLogoWrapper" class="w-48 h-28 bg-brand rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-bold mb-4 shadow-lg overflow-hidden border border-gray-100 dark:border-slate-600 p-2">
                    <img id="loginLogoImg" src="" class="hidden w-full h-full object-contain" alt="Firma Logosu">
                    <span id="loginDefaultLogoTxt" style="font-size: 28px;">ALTUN</span>
                </div>
                <h2 class="text-2xl font-bold mt-2">Giriş Yap</h2>
            </div>
            <div class="space-y-4">
                <input type="text" id="loginUser" placeholder="Kullanıcı Adı" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner focus:ring-2 focus:ring-brand outline-none transition-colors">
                <input type="password" id="loginPass" placeholder="Şifre" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner focus:ring-2 focus:ring-brand outline-none transition-colors">
                <label class="flex items-center space-x-2 text-sm cursor-pointer">
                    <input type="checkbox" id="rememberMe" class="rounded border-gray-300 dark:border-slate-600 bg-gray-50 dark:bg-slate-900 text-brand focus:ring-brand">
                    <span>Beni Hatırla</span>
                </label>
                <button onclick="login()" class="w-full bg-brand text-white py-3 rounded-xl font-bold hover:bg-blue-600 transition shadow-lg">Giriş</button>
            </div>
        </div>
    </div>

    <!-- ANA UYGULAMA -->
    <div id="appView" class="hidden w-full h-full flex relative">

        <!-- SOL MENÜ -->
        <aside id="sidebar" class="w-64 bg-white dark:bg-cardDark shadow-xl flex flex-col h-full z-50 shrink-0">
            <div class="h-28 relative border-b dark:border-slate-700 flex items-center justify-between pr-4">
                <div class="custom-logo-container">
                    <img id="appLogoImg" src="" class="hidden" alt="Firma Logosu">
                    <div id="defaultLogo" class="bg-brand text-white font-bold flex items-center justify-center rounded-xl shadow-lg tracking-wider" style="width: 120px; height: 60px; font-size: 24px;">ALTUN</div>
                </div>
            </div>

            <nav class="flex-1 overflow-y-auto py-4 px-4 space-y-2">
                <button onclick="nav('alacak')" id="nav-alacak" class="nav-btn w-full flex items-center py-3 px-4 rounded-xl text-brand bg-blue-50 dark:bg-slate-800 transition-all">
                    <span class="text-2xl min-w-[30px] text-center">💳</span><span class="font-bold block ml-3">Alacak</span>
                </button>
                <button onclick="nav('verecek')" id="nav-verecek" class="nav-btn w-full flex items-center py-3 px-4 rounded-xl text-gray-500 hover:bg-gray-50 dark:hover:bg-slate-800 transition-all">
                    <span class="text-2xl min-w-[30px] text-center">💸</span><span class="font-bold block ml-3">Verecek</span>
                </button>
                <button onclick="nav('ortaklik')" id="nav-ortaklik" class="nav-btn w-full flex items-center py-3 px-4 rounded-xl text-gray-500 hover:bg-gray-50 dark:hover:bg-slate-800 transition-all">
                    <span class="text-2xl min-w-[30px] text-center">🤝</span><span class="font-bold block ml-3">Ortaklık</span>
                </button>
                <button onclick="nav('masraflar')" id="nav-masraflar" class="nav-btn w-full flex items-center py-3 px-4 rounded-xl text-gray-500 hover:bg-gray-50 dark:hover:bg-slate-800 transition-all">
                    <span class="text-2xl min-w-[30px] text-center">📉</span><span class="font-bold block ml-3">Masraflar</span>
                </button>
                <button onclick="nav('teklifler')" id="nav-teklifler" class="nav-btn w-full flex items-center py-3 px-4 rounded-xl text-gray-500 hover:bg-gray-50 dark:hover:bg-slate-800 transition-all">
                    <span class="text-2xl min-w-[30px] text-center">📄</span><span class="font-bold block ml-3">Teklifler</span>
                </button>
                <button onclick="nav('notlar')" id="nav-notlar" class="nav-btn w-full flex items-center py-3 px-4 rounded-xl text-gray-500 hover:bg-gray-50 dark:hover:bg-slate-800 transition-all">
                    <span class="text-2xl min-w-[30px] text-center">📝</span><span class="font-bold block ml-3">Notlar</span>
                </button>
                <button onclick="nav('ayarlar')" id="nav-ayarlar" class="nav-btn w-full flex items-center py-3 px-4 rounded-xl text-gray-500 hover:bg-gray-50 dark:hover:bg-slate-800 transition-all">
                    <span class="text-2xl min-w-[30px] text-center">⚙️</span><span class="font-bold block ml-3">Ayarlar</span>
                </button>
            </nav>

            <div class="p-4 border-t dark:border-slate-700">
                <button onclick="logout()" class="w-full flex items-center py-3 px-4 rounded-xl text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 transition-all">
                    <span class="text-2xl min-w-[30px] text-center">🚪</span><span class="font-bold block ml-3">Çıkış Yap</span>
                </button>
            </div>
        </aside>

        <!-- SAĞ İÇERİK ALANI -->
        <div class="flex-1 flex flex-col h-full overflow-hidden relative w-full">
            <header class="h-16 bg-white dark:bg-cardDark shadow-sm flex items-center justify-between px-6 shrink-0 z-30">
                <h1 class="text-2xl font-bold truncate" id="headerTitle">Alacaklar</h1>
                <div class="flex gap-3 items-center">
                    <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-slate-800 flex items-center justify-center hover:scale-105 transition-transform text-lg shadow-sm">🌓</button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-6" id="mainContent">
                <!-- Dinamik İçerik Buraya Gelecek -->
            </main>
        </div>
    </div>

    <!-- MODAL ARKA PLANI -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/60 z-[60] hidden items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div id="modalContent" class="bg-white dark:bg-cardDark w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-2xl shadow-2xl p-8 relative">
            <!-- Modal İçeriği Dinamik Gelecek -->
        </div>
    </div>

    <!-- ONAY MODALI -->
    <div id="confirmOverlay" class="fixed inset-0 bg-black/70 z-[80] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white dark:bg-cardDark w-full max-w-sm rounded-2xl shadow-2xl p-6 text-center">
            <div class="text-4xl mb-3">⚠️</div>
            <h3 id="confirmTitle" class="text-xl font-bold mb-2">Emin misiniz?</h3>
            <p id="confirmText" class="text-sm text-gray-500 dark:text-gray-400 mb-6">Bu işlemi gerçekleştirmek istediğinize emin misiniz?</p>
            <div class="flex gap-3">
                <button id="confirmNoBtn" class="flex-1 bg-gray-200 dark:bg-slate-700 py-2.5 rounded-xl font-bold transition-colors">İptal</button>
                <button id="confirmYesBtn" class="flex-1 bg-red-500 text-white py-2.5 rounded-xl font-bold hover:bg-red-600 transition-colors">Evet, Sil</button>
            </div>
        </div>
    </div>

    <script>
        let currentModule = 'alacak';
        let currentDetailId = null; 
        let sonParaBirimi = '₺'; 
        let dbFileHandle = null; 
        
        let db = {
            settings: { 
                user: 'a', 
                pass: '1234', 
                logo: '', 
                kdvDefault: 20, 
                kdvActive: { 
                    alacakOdendi: true, 
                    alacakOdenmedi: true, 
                    verecekOdendi: true, 
                    verecekOdenmedi: true, 
                    teklif: true 
                },
                teklifSabitAlanlar: [],
                sirketBilgileri: {
                    adi: '',
                    tel: '',
                    eposta: '',
                    adres: '',
                    yetkili: '',
                    imzaLogo: ''
                }
            },
            alacak: [], 
            verecek: [], 
            ortaklik: [], 
            masraflar: [], 
            teklifler: [], 
            notlar: []
        };

        let fontRegularBase64 = null;
        let fontBoldBase64 = null;

        document.addEventListener('keydown', (e) => { 
            if (e.key === 'Escape') closeModal(); 
        });

        function showToast(title, message, type = 'success') {
            const toast = document.getElementById('appToast');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMessage').innerText = message;
            
            if (type === 'success') document.getElementById('toastIcon').innerText = '✅';
            else if (type === 'error') document.getElementById('toastIcon').innerText = '❌';
            else document.getElementById('toastIcon').innerText = 'ℹ️';
            
            toast.classList.remove('translate-x-full', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
            }, 3000);
        }

        function showCustomConfirm(title, text, onYes) {
            const overlay = document.getElementById('confirmOverlay');
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmText').innerText = text;
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');

            const yesBtn = document.getElementById('confirmYesBtn');
            const noBtn = document.getElementById('confirmNoBtn');

            const newYes = yesBtn.cloneNode(true);
            const newNo = noBtn.cloneNode(true);
            yesBtn.parentNode.replaceChild(newYes, yesBtn);
            noBtn.parentNode.replaceChild(newNo, noBtn);

            newYes.addEventListener('click', () => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                onYes();
            });

            newNo.addEventListener('click', () => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            });
        }

        // PWA Kurulum Desteği İçin Arka Plan (Blob) Service Worker
        if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
            window.addEventListener('load', () => {
                const swCode = "self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('activate', e => self.clients.claim()); self.addEventListener('fetch', e => {});";
                const swBlob = new Blob([swCode], {type: 'application/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>console.log("SW failed (Normal for some local files)"));
            });
        }

        function updateManifest() {
            const appName = "Altun Hesap Takip";
            const logoSrc = (db.settings && db.settings.logo) ? db.settings.logo : "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='192' height='192' viewBox='0 0 192 192'><rect width='192' height='192' rx='40' fill='%233b82f6'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' font-family='Arial, sans-serif' font-size='45' font-weight='bold' fill='%23ffffff'>ALTUN</text></svg>";
            const mimeType = logoSrc.startsWith('data:') ? (logoSrc.includes('svg') ? 'image/svg+xml' : 'image/png') : 'image/jpeg';
            
            const currentUrl = window.location.href.split('#')[0].split('?')[0];

            const manifestObj = {
                name: appName,
                short_name: "ALTUN",
                start_url: currentUrl,
                display: "standalone",
                background_color: "#0f172a",
                theme_color: "#3b82f6",
                icons: [
                    { src: logoSrc, sizes: "192x192", type: mimeType, purpose: "any maskable" },
                    { src: logoSrc, sizes: "512x512", type: mimeType, purpose: "any maskable" }
                ]
            };

            const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
            document.getElementById('dynamicManifest').setAttribute('href', URL.createObjectURL(blob));
        }

        function updateLogoView() {
            const img = document.getElementById('appLogoImg');
            const def = document.getElementById('defaultLogo');
            const loginImg = document.getElementById('loginLogoImg');
            const loginTxt = document.getElementById('loginDefaultLogoTxt');

            if(db.settings && db.settings.logo) {
                if(img) { img.src = db.settings.logo; img.classList.remove('hidden'); }
                if(def) def.classList.add('hidden');
                if(loginImg) { loginImg.src = db.settings.logo; loginImg.classList.remove('hidden'); }
                if(loginTxt) loginTxt.classList.add('hidden');
            } else {
                if(img) img.classList.add('hidden'); 
                if(def) def.classList.remove('hidden');
                if(loginImg) loginImg.classList.add('hidden');
                if(loginTxt) loginTxt.classList.remove('hidden');
            }
        }

        // --- YEREL DOSYA MİMARİSİ (LOCAL STORAGE + FILE SYSTEM ACCESS API) ---
        async function loadDB() {
            const localData = localStorage.getItem('hesapTakip_yerel_db');
            if(localData) {
                try {
                    const parsed = JSON.parse(localData);
                    db = parsed;
                } catch(e) { console.error("Veri okunamadı."); }
            }

            if(!db.settings) db.settings = { user: 'a', pass: '1234', logo: '', kdvDefault: 20, kdvActive: { alacakOdendi: true, alacakOdenmedi: true, verecekOdendi: true, verecekOdenmedi: true, teklif: true }, teklifSabitAlanlar: [] };
            if(!db.settings.sirketBilgileri) db.settings.sirketBilgileri = { adi: '', tel: '', eposta: '', adres: '', yetkili: '', imzaLogo: '' };
            if(!db.alacak) db.alacak = []; 
            if(!db.verecek) db.verecek = []; 
            if(!db.ortaklik) db.ortaklik = [];
            if(!db.masraflar) db.masraflar = []; 
            if(!db.teklifler) db.teklifler = []; 
            if(!db.notlar) db.notlar = [];

            updateLogoView();
            updateManifest();
        }

        async function saveDB() {
            localStorage.setItem('hesapTakip_yerel_db', JSON.stringify(db));
            
            if (dbFileHandle) {
                try {
                    const writable = await dbFileHandle.createWritable();
                    await writable.write(JSON.stringify(db, null, 2));
                    await writable.close();
                } catch (e) {
                    console.error('Dosyaya yazılamadı, izniniz olmayabilir.', e);
                }
            }
        }

        async function selectSaveFile() {
            try {
                const options = {
                    types: [{
                        description: 'JSON Veritabanı',
                        accept: {'application/json': ['.json']},
                    }],
                };
                dbFileHandle = await window.showSaveFilePicker(options);
                document.getElementById('fileHandleStatus').innerText = "Bağlı Dosya: " + dbFileHandle.name;
                showToast('Başarılı', 'Kayıt konumu ayarlandı. Artık tüm veriler saniyesinde bu dosyaya yazılacak.', 'success');
                saveDB(); 
            } catch (err) {
                console.log('Kullanıcı dosya seçimini iptal etti veya tarayıcı desteklemiyor.');
            }
        }

        async function importFile(input) {
            if (!input.files || input.files.length === 0) return;
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    db = parsed;
                    await saveDB();
                    showToast('Başarılı', 'Veriler dışarıdan başarıyla içe aktarıldı!', 'success');
                    if(currentModule === 'ayarlar') renderAyarlar(document.getElementById('mainContent'));
                    else nav(currentModule);
                } catch(err) {
                    showToast('Hata', 'Geçersiz dosya formatı!', 'error');
                }
            };
            reader.readAsText(file);
        }

        // --- GİRİŞ & TEMEL AYARLAR ---
        window.onload = async () => {
            if(localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.remove('dark');
            }
            
            await loadDB(); 

            const savedUser = localStorage.getItem('ht_user');
            const savedPass = localStorage.getItem('ht_pass');
            
            if(savedUser && savedPass && savedUser === db.settings.user && savedPass === db.settings.pass) {
                showApp();
            }
        };

        function login() {
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;
            const rem = document.getElementById('rememberMe').checked;

            if(u === db.settings.user && p === db.settings.pass) {
                if(rem) { 
                    localStorage.setItem('ht_user', u); 
                    localStorage.setItem('ht_pass', p); 
                }
                showApp();
            } else {
                showToast('Hata', 'Hatalı kullanıcı adı veya şifre!', 'error');
            }
        }

        function logout() {
            localStorage.removeItem('ht_user');
            localStorage.removeItem('ht_pass');
            document.getElementById('appView').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
            document.getElementById('loginView').classList.add('flex');
            showToast('Çıkış', 'Oturum kapatıldı.', 'info');
        }

        function showApp() {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('loginView').classList.remove('flex');
            document.getElementById('appView').classList.remove('hidden');
            updateLogoView();
            updateManifest();
            nav('alacak');
        }

        function toggleTheme() {
            const root = document.documentElement;
            root.classList.toggle('dark');
            localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
        }

        // --- HESAPLAMALAR ---
        function hesaplaKasa() {
            let kasa = 0;
            (db.alacak || []).forEach(c => {
                (c.islemler || []).forEach(i => {
                    if(i.durum === 'Ödendi') kasa += (parseFloat(i.toplam) || 0);
                });
            });
            (db.verecek || []).forEach(c => {
                (c.islemler || []).forEach(i => {
                    if(i.durum === 'Ödendi') kasa -= (parseFloat(i.toplam) || 0);
                });
            });
            (db.ortaklik || []).forEach(c => {
                (c.islemler || []).forEach(i => {
                    const t = parseFloat(i.toplam) || 0;
                    if(i.ortakTipi === 'Alınan') kasa += t;
                    if(i.ortakTipi === 'Verilen') kasa -= t;
                });
            });
            (db.masraflar || []).forEach(m => {
                kasa -= (parseFloat(m.toplam) || 0);
            });
            return kasa;
        }

        function toplamAlacakGoster() {
            let toplam = 0;
            (db.alacak || []).forEach(c => {
                toplam += hesaplaBakiye(c.islemler, 'alacak');
            });
            return toplam;
        }

        function toplamVerecekGoster() {
            let toplam = 0;
            (db.verecek || []).forEach(c => {
                toplam += hesaplaBakiye(c.islemler, 'verecek');
            });
            return toplam;
        }

        function hesaplaBakiye(islemler, type) {
            if(!islemler) return 0;
            let bakiye = 0;
            islemler.forEach(islem => {
                const tutar = parseFloat(islem.toplam) || 0;
                if(islem.durum === 'Ödenmedi') bakiye += tutar;
                if(islem.durum === 'Ödendi') bakiye -= tutar;
            });
            return bakiye;
        }

        function renderDashboardSummary() {
            const toplamAlacak = toplamAlacakGoster();
            const toplamVerecek = toplamVerecekGoster();
            const kasa = hesaplaKasa();
            const kasaRenk = kasa >= 0 ? 'text-green-500' : 'text-red-500';

            return `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    <div class="bg-white dark:bg-cardDark p-4 rounded-2xl shadow-sm border dark:border-slate-700 flex flex-col justify-center">
                        <span class="text-xs text-gray-500 uppercase tracking-wider mb-1">Toplam Alacak</span>
                        <b class="text-green-500 text-2xl font-bold">${toplamAlacak.toLocaleString('tr-TR')} ₺</b>
                    </div>
                    <div class="bg-white dark:bg-cardDark p-4 rounded-2xl shadow-sm border dark:border-slate-700 flex flex-col justify-center">
                        <span class="text-xs text-gray-500 uppercase tracking-wider mb-1">Toplam Verecek</span>
                        <b class="text-red-500 text-2xl font-bold">${toplamVerecek.toLocaleString('tr-TR')} ₺</b>
                    </div>
                    <div class="bg-white dark:bg-cardDark p-4 rounded-2xl shadow-sm border dark:border-slate-700 flex flex-col justify-center">
                        <span class="text-xs text-gray-500 uppercase tracking-wider mb-1">Kasa Durumu</span>
                        <b class="${kasaRenk} text-2xl font-bold">${kasa.toLocaleString('tr-TR')} ₺</b>
                    </div>
                </div>
            `;
        }

        // --- YÖNLENDİRME (ROUTING) ---
        function nav(moduleName) {
            currentModule = moduleName;
            currentDetailId = null; 
            
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('text-brand', 'bg-blue-50', 'dark:bg-slate-800');
                b.classList.add('text-gray-500');
            });
            const activeBtn = document.getElementById(`nav-${moduleName}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-gray-500');
                activeBtn.classList.add('text-brand', 'bg-blue-50', 'dark:bg-slate-800');
            }
            
            const titles = { 
                alacak: 'Alacak Takibi', 
                verecek: 'Verecek Takibi', 
                ortaklik: 'Ortaklar', 
                masraflar: 'Masraflar', 
                teklifler: 'Teklifler', 
                notlar: 'Notlar', 
                ayarlar: 'Ayarlar' 
            };
            document.getElementById('headerTitle').innerText = titles[moduleName];

            const main = document.getElementById('mainContent');
            if(moduleName === 'ayarlar') return renderAyarlar(main);
            if(moduleName === 'notlar') return renderNotlar(main);
            if(moduleName === 'teklifler') return renderTeklifler(main);
            if(moduleName === 'masraflar') return renderMasraflar(main);
            
            renderCariList(main, moduleName);
        }

        // --- MODAL YARDIMCILARI ---
        function showModal(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalOverlay').classList.remove('hidden');
            document.getElementById('modalOverlay').classList.add('flex');
            document.body.classList.add('modal-open');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
            document.getElementById('modalOverlay').classList.remove('flex');
            document.body.classList.remove('modal-open');
        }

        // --- CARİ LİSTESİ (Alacak, Verecek, Ortaklık) ---
        function renderCariList(container, type) {
            const data = db[type] || [];
            let html = `
                ${renderDashboardSummary()}
                <div class="flex flex-col sm:flex-row gap-3 mb-6">
                    <input type="text" id="searchInput" onkeyup="filterCari()" placeholder="Kayıtlar içinde ara..." class="flex-1 p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner focus:ring-2 focus:ring-brand outline-none transition-colors">
                    <button onclick="openCariModal('${type}')" class="bg-brand text-white px-6 py-3 rounded-xl font-bold shadow-md hover:bg-blue-600 transition-colors whitespace-nowrap">+ Yeni Ekle</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4" id="cariListContainer">
            `;
            
            if(data.length === 0) {
                container.innerHTML = html + `</div><div class="text-center py-20 text-gray-400 text-lg">Kayıt bulunamadı.</div>`;
                return;
            }
            
            data.forEach(item => {
                let tutarYazi = '';
                if(type === 'ortaklik') {
                    const alinan = parseFloat(item.aldigi) || 0;
                    const verilen = parseFloat(item.verdigi) || 0;
                    const fark = Math.abs(alinan - verilen);
                    
                    let durumYazi = alinan > verilen 
                        ? `<span class="text-red-500 font-bold">Ortak Alacaklı: ${fark.toLocaleString('tr-TR')} ₺</span>` 
                        : (verilen > alinan 
                            ? `<span class="text-green-500 font-bold">Ortak Borçlu: ${fark.toLocaleString('tr-TR')} ₺</span>` 
                            : `<span class="text-gray-500 font-bold">Hesaplar Eşit</span>`);
                            
                    tutarYazi = `
                        <div class="text-sm mt-3 space-y-1 bg-gray-50 dark:bg-slate-800 p-3 rounded-lg border border-gray-100 dark:border-slate-700">
                            <div class="flex justify-between"><span>Alınan:</span> <b>${alinan.toLocaleString('tr-TR')} ₺</b></div>
                            <div class="flex justify-between border-b dark:border-slate-600 pb-1"><span>Verilen:</span> <b>${verilen.toLocaleString('tr-TR')} ₺</b></div>
                            <div class="text-right pt-1">${durumYazi}</div>
                        </div>`;
                } else {
                    const toplam = hesaplaBakiye(item.islemler, type);
                    const renk = type === 'alacak' ? 'text-green-500' : 'text-red-500';
                    tutarYazi = `<div class="font-bold text-xl mt-2 ${renk}">${toplam.toLocaleString('tr-TR')} ₺</div>`;
                }
                
                html += `
                    <div class="bg-white dark:bg-cardDark p-5 rounded-2xl shadow-sm border border-transparent hover:border-gray-200 dark:hover:border-slate-600 flex flex-col justify-between transition-all group">
                        <div class="cursor-pointer" onclick="renderCariDetail('${type}', '${item.id}')">
                            <h3 class="font-bold text-lg text-gray-800 dark:text-white truncate" title="${item.isim}">${item.isim}</h3>
                            ${tutarYazi}
                        </div>
                        <div class="flex gap-2 mt-4 pt-4 border-t dark:border-slate-700">
                            <button onclick="event.stopPropagation(); openCariModal('${type}', '${item.id}')" class="flex-1 py-2 text-blue-500 bg-blue-50 dark:bg-slate-800 rounded-lg hover:bg-blue-100 font-medium transition-colors">Düzenle</button>
                            <button onclick="event.stopPropagation(); deleteCari('${type}', '${item.id}')" class="flex-1 py-2 text-red-500 bg-red-50 dark:bg-slate-800 rounded-lg hover:bg-red-100 font-medium transition-colors">Sil</button>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function filterCari() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('cariListContainer');
            if(container) {
                Array.from(container.children).forEach(card => {
                    const title = card.querySelector('h3')?.innerText.toLowerCase() || '';
                    card.style.display = title.includes(query) ? 'flex' : 'none';
                });
            }
        }

        function openCariModal(type, id = null) {
            const cari = id ? db[type].find(x => x.id === id) : {};
            const baslik = type === 'alacak' ? 'Müşteri' : (type === 'verecek' ? 'Tedarikçi' : 'Ortak');
            
            showModal(`
                <h3 class="text-2xl font-bold mb-6 text-gray-800 dark:text-white border-b dark:border-slate-700 pb-2">${id ? 'Bilgileri Düzenle' : 'Yeni ' + baslik + ' Ekle'}</h3>
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-gray-500 mb-1 block">Kurum/Kişi Adı *</label>
                        <input type="text" id="m_isim" value="${cari.isim||''}" placeholder="Zorunlu Alan" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs text-gray-500 mb-1 block">Telefon</label>
                            <input type="text" id="m_tel" value="${cari.tel||''}" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 mb-1 block">E-posta</label>
                            <input type="text" id="m_eposta" value="${cari.eposta||''}" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 mb-1 block">Adres</label>
                        <textarea id="m_adres" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors h-24">${cari.adres||''}</textarea>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-3 pt-4 mt-4 border-t dark:border-slate-700">
                        <button onclick="closeModal()" class="w-full sm:flex-1 bg-gray-200 dark:bg-slate-700 py-3 rounded-xl font-bold order-2 sm:order-1">İptal</button>
                        <button onclick="saveCari('${type}', '${id||''}')" class="w-full sm:flex-1 bg-brand text-white py-3 rounded-xl font-bold order-1 sm:order-2">Kaydet</button>
                    </div>
                </div>
            `);
        }

        function saveCari(type, id) {
            const isim = document.getElementById('m_isim').value.trim();
            if(!isim) { 
                showToast('Uyarı', 'İsim alanı zorunludur!', 'error'); 
                return; 
            }
            const isDuplicate = db[type].some(x => x.isim.toLowerCase() === isim.toLowerCase() && x.id !== id);
            if(isDuplicate) { 
                showToast('Uyarı', `"${isim}" isminde bir kayıt zaten var!`, 'error'); 
                return; 
            }
            
            const newData = {
                id: id || Date.now().toString(),
                isim: isim,
                tel: document.getElementById('m_tel').value,
                eposta: document.getElementById('m_eposta').value,
                adres: document.getElementById('m_adres').value,
                islemler: id ? db[type].find(x=>x.id===id).islemler : [],
                aldigi: id && type==='ortaklik' ? db[type].find(x=>x.id===id).aldigi : 0,
                verdigi: id && type==='ortaklik' ? db[type].find(x=>x.id===id).verdigi : 0
            };

            if(id) { 
                const idx = db[type].findIndex(x=>x.id===id); 
                db[type][idx] = newData; 
            } else { 
                db[type].push(newData); 
            }
            
            closeModal(); 
            saveDB(); 
            nav(type);
            showToast('Başarılı', 'Kayıt başarıyla kaydedildi.', 'success');
        }

        function deleteCari(type, id) {
            showCustomConfirm('Kaydı Sil', 'Bu kaydı ve bağlı tüm işlemlerini silmek istediğinize emin misiniz?', () => {
                db[type] = db[type].filter(x => x.id !== id); 
                saveDB(); 
                nav(type);
                showToast('Bilgi', 'Kayıt silindi.', 'info');
            });
        }

        function renderCariDetail(type, id) {
            currentDetailId = id;
            const cari = db[type].find(x => x.id === id);
            if(!cari) return nav(type);

            let bakiyeHtml = '';
            
            if(type === 'ortaklik') {
                const alinan = parseFloat(cari.aldigi) || 0;
                const verilen = parseFloat(cari.verdigi) || 0;
                const fark = Math.abs(alinan - verilen);
                
                let durumYazi = alinan > verilen 
                    ? `<span class="text-red-400 opacity-80 uppercase tracking-wider text-sm mb-1 block">Ortak Alacaklı</span><b class="text-red-400 text-3xl font-black">${fark.toLocaleString('tr-TR')} ₺</b>` 
                    : (verilen > alinan 
                        ? `<span class="text-green-400 opacity-80 uppercase tracking-wider text-sm mb-1 block">Ortak Borçlu</span><b class="text-green-400 text-3xl font-black">${fark.toLocaleString('tr-TR')} ₺</b>` 
                        : `<span class="text-gray-400 opacity-80 uppercase tracking-wider text-sm mb-1 block">Net Durum</span><b class="text-gray-400 text-3xl font-black">Eşit (0 ₺)</b>`);

                bakiyeHtml = `
                    <div class="bg-cardDark p-6 rounded-2xl text-center text-white mb-6 grid grid-cols-1 sm:grid-cols-3 gap-4 shadow-md">
                        <div class="bg-slate-800 p-4 rounded-xl flex flex-col justify-center border border-slate-700/50">
                            <span class="text-sm opacity-80 uppercase tracking-wider mb-1">Toplam Alınan</span>
                            <b class="text-gray-200 text-3xl font-bold">${alinan.toLocaleString('tr-TR')} ₺</b>
                        </div>
                        <div class="bg-slate-800 p-4 rounded-xl flex flex-col justify-center border border-slate-700/50">
                            <span class="text-sm opacity-80 uppercase tracking-wider mb-1">Toplam Verilen</span>
                            <b class="text-gray-200 text-3xl font-bold">${verilen.toLocaleString('tr-TR')} ₺</b>
                        </div>
                        <div class="bg-slate-800 p-4 rounded-xl flex flex-col justify-center border border-slate-700/50">
                            ${durumYazi}
                        </div>
                    </div>`;
            } else {
                const bakiye = hesaplaBakiye(cari.islemler, type);
                const renk = bakiye >= 0 ? (type==='alacak'?'text-green-500':'text-red-500') : 'text-gray-400';
                bakiyeHtml = `
                    <div class="bg-cardDark p-6 rounded-2xl text-center text-white mb-6 shadow-md">
                        <div class="text-sm opacity-80 uppercase tracking-wider mb-1">Toplam Kalan ${type === 'alacak' ? 'Alacak' : 'Borç'}</div>
                        <div class="text-4xl font-black ${renk}">${bakiye.toLocaleString('tr-TR')} ₺</div>
                    </div>`;
            }

            let html = `
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <button onclick="nav('${type}')" class="mb-2 text-brand font-bold flex items-center hover:underline">← Listeye Dön</button>
                        <h2 class="text-3xl font-bold">${cari.isim}</h2>
                        <div class="text-sm text-gray-500 mt-1">Tel: ${cari.tel || '-'} | E-posta: ${cari.eposta || '-'}</div>
                    </div>
                    <button onclick="exportIslemlerPDF('${type}', '${id}', this)" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-xl font-bold shadow-md transition-colors">PDF Çıktısı</button>
                </div>
                ${bakiyeHtml}
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold">İşlem Geçmişi</h3>
                    <button onclick="openIslemModal('${type}', '${id}')" class="bg-brand text-white px-6 py-2 rounded-xl font-bold shadow-md hover:bg-blue-600">+ Yeni İşlem</button>
                </div>
                <div class="space-y-3">
            `;

            const islemler = cari.islemler || [];
            if(islemler.length === 0) {
                html += `<div class="text-center text-gray-500 mt-10 bg-white dark:bg-cardDark p-10 rounded-2xl border border-dashed dark:border-slate-700">Henüz işlem bulunmuyor.</div>`;
            }

            islemler.slice().reverse().forEach(islem => {
                const isOdenmis = islem.durum === 'Ödendi';
                const islemRenk = isOdenmis ? 'border-gray-400 opacity-75' : (type === 'alacak' ? 'border-green-500' : 'border-red-500');
                
                let detay = '';
                if(type === 'ortaklik') {
                    detay = islem.ortakTipi === 'Alınan' 
                        ? '<span class="text-green-500 font-bold">Ortaktan Alındı</span>' 
                        : '<span class="text-red-500 font-bold">Ortağa Verildi</span>';
                } else {
                    detay = isOdenmis 
                        ? `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-md text-xs font-bold">Ödendi (${islem.odemeTuru})</span>` 
                        : `<span class="bg-red-100 text-red-700 px-3 py-1 rounded-md text-xs font-bold">Ödenmedi</span>`;
                }
                
                const miktarBirimRozeti = (islem.miktar && islem.birim) 
                    ? `<span class="bg-blue-100 dark:bg-slate-700 text-blue-700 dark:text-blue-300 px-2 py-0.5 rounded text-xs ml-2 align-middle shadow-sm">${islem.miktar} ${islem.birim}</span>` 
                    : '';

                html += `
                    <div class="bg-white dark:bg-cardDark p-5 rounded-xl shadow-sm border-l-4 ${islemRenk} flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex-1 min-w-0">
                            <div class="text-xs text-gray-500 font-medium mb-1">${islem.tarih}</div>
                            <div class="font-bold text-lg flex items-center break-words">${islem.aciklama} ${miktarBirimRozeti}</div>
                        </div>
                        <div class="text-left md:text-right shrink-0">
                            <div class="font-black text-xl">${parseFloat(islem.toplam).toLocaleString('tr-TR')} ₺</div>
                            <div class="mt-2">${detay}</div>
                        </div>
                        <div class="flex md:flex-col gap-2 border-t md:border-t-0 md:border-l dark:border-slate-700 pt-3 md:pt-0 md:pl-4 mt-2 md:mt-0 items-center justify-center shrink-0">
                            <button onclick="openIslemModal('${type}', '${id}', '${islem.id}')" class="text-sm font-bold text-blue-500 bg-blue-50 dark:bg-slate-800 px-3 py-1.5 rounded-lg w-full hover:bg-blue-100 transition-colors">Düzenle</button>
                            <button onclick="deleteIslem('${type}', '${id}', '${islem.id}')" class="text-sm font-bold text-red-500 bg-red-50 dark:bg-slate-800 px-3 py-1.5 rounded-lg w-full hover:bg-red-100 transition-colors">Sil</button>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            document.getElementById('mainContent').innerHTML = html;
        }

        // --- İŞLEM EKLEME VE DÜZENLEME MODALI ---
        function openIslemModal(type, cariId, islemId = null) {
            const cari = db[type].find(x => x.id === cariId);
            const islem = islemId ? (cari.islemler || []).find(x => x.id === islemId) : null;
            const bugun = islem ? islem.tarih : new Date().toISOString().split('T')[0];
            
            let html = `
                <h3 class="text-2xl font-bold mb-6 border-b dark:border-slate-700 pb-2">${islemId ? 'İşlemi Düzenle' : 'Yeni İşlem'}</h3>
                <div class="space-y-4">
                    <input type="date" id="i_tarih" value="${bugun}" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors font-medium">
                    <input type="text" id="i_aciklama" value="${islem ? islem.aciklama : ''}" placeholder="İşlem Açıklaması (Örn: Bakım Hizmeti, Mal Alımı)" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors font-bold">
            `;

            if(type === 'ortaklik') {
                const eskiTutar = islem ? (islem.toplam / (islem.miktar || 1)) : '';
                html += `
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="text-xs text-gray-500 mb-1 block">Miktar</label>
                            <input type="number" id="i_miktar" value="${islem ? (islem.miktar || 1) : 1}" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors text-center font-bold">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 mb-1 block">Birim</label>
                            <input type="text" id="i_birim" value="${islem ? (islem.birim || 'Adet') : 'Adet'}" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors text-center">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 mb-1 block">Birim Tutar</label>
                            <input type="number" id="i_tutar" value="${eskiTutar}" placeholder="0.00" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors font-bold text-brand">
                        </div>
                    </div>
                    <select id="i_ortakTipi" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors font-bold mt-2">
                        <option value="Alınan" ${islem && islem.ortakTipi === 'Alınan' ? 'selected' : ''}>Ortaktan Para/Mal Alındı (Kasaya Girdi)</option>
                        <option value="Verilen" ${islem && islem.ortakTipi === 'Verilen' ? 'selected' : ''}>Ortağa Para/Mal Verildi (Kasadan Çıktı)</option>
                    </select>
                `;
            } else {
                html += `
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <div>
                            <label class="text-xs text-gray-500 mb-1 block">Miktar</label>
                            <input type="number" id="i_miktar" value="${islem ? (islem.miktar || 1) : 1}" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors text-center font-bold" oninput="calcIslem()">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 mb-1 block">Birim</label>
                            <input type="text" id="i_birim" value="${islem ? (islem.birim || 'Adet') : 'Adet'}" placeholder="Ad, Kg" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors text-center">
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-xs text-gray-500 mb-1 block">Net Fiyat</label>
                            <input type="number" id="i_net" value="${islem ? (islem.net || '') : ''}" placeholder="0.00" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors font-bold" oninput="calcIslem()">
                        </div>
                        <div id="kdvWrapper" class="col-span-2 sm:col-span-1">
                            <label class="text-xs text-gray-500 mb-1 block">% KDV</label>
                            <input type="number" id="i_kdv" value="${islem ? (islem.kdv !== undefined ? islem.kdv : db.settings.kdvDefault) : db.settings.kdvDefault}" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors text-center" oninput="calcIslem()">
                        </div>
                    </div>
                    <div class="bg-gray-100 dark:bg-slate-800 p-4 rounded-xl text-right font-black text-2xl">
                        Genel Toplam: <span id="i_toplam_txt" class="text-brand">${islem ? (islem.toplam || 0).toFixed(2) : '0.00'}</span> ₺
                    </div>
                    <select id="i_durum" onchange="handleDurumChange('${type}')" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors font-bold">
                        <option value="Ödenmedi" ${islem && islem.durum === 'Ödenmedi' ? 'selected' : ''}>${type==='alacak' ? 'Açık Hesap (Borçlandır)' : 'Açık Hesap (Borçlan)'}</option>
                        <option value="Ödendi" ${islem && islem.durum === 'Ödendi' ? 'selected' : ''}>${type==='alacak' ? 'Tahsilat (Kasaya Girdi)' : 'Ödeme (Kasadan Çıktı)'}</option>
                    </select>
                    <select id="i_odemeTuru" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors hidden">
                        <option value="Nakit" ${islem && islem.odemeTuru === 'Nakit' ? 'selected' : ''}>Nakit</option>
                        <option value="Kredi Kartı" ${islem && islem.odemeTuru === 'Kredi Kartı' ? 'selected' : ''}>Kredi Kartı</option>
                        <option value="Havale/EFT" ${islem && islem.odemeTuru === 'Havale/EFT' ? 'selected' : ''}>Havale / EFT</option>
                        <option value="Çek" ${islem && islem.odemeTuru === 'Çek' ? 'selected' : ''}>Çek</option>
                    </select>
                `;
            }
            html += `
                    <div class="flex flex-col sm:flex-row gap-3 pt-4 border-t dark:border-slate-700">
                        <button onclick="closeModal()" class="w-full sm:flex-1 bg-gray-200 dark:bg-slate-700 py-3 rounded-xl font-bold order-2 sm:order-1">İptal</button>
                        <button onclick="saveIslem('${type}', '${cariId}', '${islemId || ''}')" class="w-full sm:flex-1 bg-brand text-white py-3 rounded-xl font-bold order-1 sm:order-2">Kaydet</button>
                    </div>
                </div>
            `;
            showModal(html);
            if(type !== 'ortaklik') handleDurumChange(type);
        }

        function handleDurumChange(type) {
            const d = document.getElementById('i_durum').value;
            const sel = document.getElementById('i_odemeTuru');
            if(d === 'Ödendi') sel.classList.remove('hidden'); 
            else sel.classList.add('hidden');

            if(type !== 'ortaklik') {
                const kdvW = document.getElementById('kdvWrapper'); 
                const kdvI = document.getElementById('i_kdv');
                let isKdvActive = false;
                
                if(type === 'alacak' && d === 'Ödendi') isKdvActive = db.settings.kdvActive.alacakOdendi !== false;
                if(type === 'alacak' && d === 'Ödenmedi') isKdvActive = db.settings.kdvActive.alacakOdenmedi !== false;
                if(type === 'verecek' && d === 'Ödendi') isKdvActive = db.settings.kdvActive.verecekOdendi !== false;
                if(type === 'verecek' && d === 'Ödenmedi') isKdvActive = db.settings.kdvActive.verecekOdenmedi !== false;
                
                if(isKdvActive) { 
                    kdvW.classList.remove('hidden'); 
                } else { 
                    kdvW.classList.add('hidden'); 
                    kdvI.value = 0; 
                }
                calcIslem();
            }
        }

        function calcIslem() {
            const miktar = parseFloat(document.getElementById('i_miktar').value) || 1;
            const net = parseFloat(document.getElementById('i_net').value) || 0; 
            const kdv = parseFloat(document.getElementById('i_kdv').value) || 0;
            const araToplam = net * miktar;
            const toplam = araToplam + (araToplam * kdv / 100); 
            document.getElementById('i_toplam_txt').innerText = toplam.toFixed(2);
        }

        function saveIslem(type, cariId, islemId) {
            const cari = db[type].find(x => x.id === cariId);
            const aciklama = document.getElementById('i_aciklama').value.trim();
            if(!aciklama) { 
                showToast('Uyarı', 'Açıklama girmelisiniz.', 'error'); 
                return; 
            }
            
            const miktar = parseFloat(document.getElementById('i_miktar').value) || 1;
            const birim = document.getElementById('i_birim').value.trim() || 'Adet';

            if(type === 'ortaklik') {
                const islem = islemId ? (cari.islemler || []).find(x => x.id === islemId) : null;
                if(islem) { 
                    if(islem.ortakTipi === 'Alınan') cari.aldigi -= islem.toplam; 
                    else cari.verdigi -= islem.toplam; 
                }

                const ortakTipi = document.getElementById('i_ortakTipi').value; 
                const tutar = parseFloat(document.getElementById('i_tutar').value) || 0;
                const toplam = tutar * miktar;

                if(ortakTipi === 'Alınan') cari.aldigi = (parseFloat(cari.aldigi)||0) + toplam; 
                else cari.verdigi = (parseFloat(cari.verdigi)||0) + toplam;

                const islemObj = { 
                    id: islemId || Date.now().toString(), 
                    tarih: document.getElementById('i_tarih').value, 
                    aciklama: aciklama, 
                    miktar: miktar, 
                    birim: birim, 
                    ortakTipi: ortakTipi, 
                    toplam: toplam 
                };

                if(!cari.islemler) cari.islemler = [];
                if(islemId) {
                    const idx = cari.islemler.findIndex(x => x.id === islemId);
                    if(idx !== -1) cari.islemler[idx] = islemObj;
                } else {
                    cari.islemler.push(islemObj);
                }
            } else {
                const net = parseFloat(document.getElementById('i_net').value) || 0; 
                const kdv = parseFloat(document.getElementById('i_kdv').value) || 0;
                const araToplam = net * miktar; 
                const toplam = araToplam + (araToplam * kdv / 100); 
                const durum = document.getElementById('i_durum').value;
                const odemeTuru = durum === 'Ödendi' ? document.getElementById('i_odemeTuru').value : '-';

                const islemObj = { 
                    id: islemId || Date.now().toString(), 
                    tarih: document.getElementById('i_tarih').value, 
                    aciklama: aciklama, 
                    miktar: miktar, 
                    birim: birim, 
                    net: net, 
                    kdv: kdv, 
                    araToplam: araToplam, 
                    toplam: toplam, 
                    durum: durum, 
                    odemeTuru: odemeTuru 
                };

                if(!cari.islemler) cari.islemler = [];
                if(islemId) {
                    const idx = cari.islemler.findIndex(x => x.id === islemId);
                    if(idx !== -1) cari.islemler[idx] = islemObj;
                } else {
                    cari.islemler.push(islemObj);
                }
            }

            closeModal(); 
            saveDB(); 
            renderCariDetail(type, cariId); 
            showToast('Başarılı', islemId ? 'İşlem güncellendi.' : 'İşlem eklendi.', 'success');
        }

        function deleteIslem(type, cariId, islemId) {
            showCustomConfirm('İşlemi Sil', 'Silmek istediğinize emin misiniz?', () => {
                const cari = db[type].find(x => x.id === cariId);
                if(type === 'ortaklik') {
                    const islem = cari.islemler.find(x=>x.id===islemId);
                    if(islem.ortakTipi === 'Alınan') cari.aldigi -= islem.toplam; 
                    else cari.verdigi -= islem.toplam;
                }
                cari.islemler = cari.islemler.filter(x => x.id !== islemId);
                
                saveDB(); 
                renderCariDetail(type, cariId); 
                showToast('Bilgi', 'İşlem silindi.', 'info');
            });
        }

        // --- MASRAFLAR ---
        function renderMasraflar(container) {
            const data = db.masraflar || [];
            let toplam = 0; 
            data.forEach(m => toplam += (parseFloat(m.toplam) || 0));
            
            let html = `
                ${renderDashboardSummary()}
                <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                    <div>
                        <h2 class="text-2xl font-bold">Masraflar Listesi</h2>
                        <span class="text-sm text-gray-500">Toplam Masraf: <b class="text-red-500">${toplam.toLocaleString('tr-TR')} ₺</b></span>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="exportMasraflarPDF(this)" class="bg-red-500 text-white px-4 py-2 rounded-xl font-bold shadow-md hover:bg-red-600 transition-colors">PDF Çıktısı</button>
                        <button onclick="openMasrafModal()" class="bg-brand text-white px-6 py-2 rounded-xl font-bold shadow-md hover:bg-blue-600 transition-colors">+ Yeni Masraf</button>
                    </div>
                </div>
                <div class="space-y-3">
            `;
            
            if(data.length === 0) {
                container.innerHTML = html + `<div class="text-center py-20 text-gray-400 bg-white dark:bg-cardDark rounded-2xl border border-dashed dark:border-slate-700">Masraf bulunamadı.</div></div>`;
                return;
            }

            data.slice().reverse().forEach(m => {
                const mb = (m.miktar && m.birim) 
                    ? `<span class="bg-blue-100 dark:bg-slate-700 text-blue-700 dark:text-blue-300 px-2 py-0.5 rounded text-xs ml-2 align-middle shadow-sm">${m.miktar} ${m.birim}</span>` 
                    : '';
                
                html += `
                    <div class="bg-white dark:bg-cardDark p-5 rounded-xl shadow-sm border-l-4 border-red-500 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex-1 min-w-0">
                            <div class="text-xs text-gray-500 font-medium mb-1">${m.tarih}</div>
                            <div class="font-bold text-lg flex items-center break-words">${m.aciklama} ${mb}</div>
                            <div class="text-xs text-gray-400 mt-1">Ödeme Türü: ${m.odemeTuru || 'Nakit'}</div>
                        </div>
                        <div class="text-left md:text-right shrink-0">
                            <div class="font-black text-xl text-red-500">${parseFloat(m.toplam).toLocaleString('tr-TR')} ₺</div>
                        </div>
                        <div class="flex md:flex-col gap-2 border-t md:border-t-0 md:border-l dark:border-slate-700 pt-3 md:pt-0 md:pl-4 mt-2 md:mt-0 items-center justify-center shrink-0">
                            <button onclick="openMasrafModal('${m.id}')" class="text-sm font-bold text-blue-500 bg-blue-50 dark:bg-slate-800 px-3 py-1.5 rounded-lg w-full hover:bg-blue-100 transition-colors">Düzenle</button>
                            <button onclick="deleteMasraf('${m.id}')" class="text-sm font-bold text-red-500 bg-red-50 dark:bg-slate-800 px-3 py-1.5 rounded-lg w-full hover:bg-red-100 transition-colors">Sil</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html + `</div>`;
        }

        function openMasrafModal(id = null) {
            const m = id ? (db.masraflar || []).find(x => x.id === id) : null;
            const bugun = m ? m.tarih : new Date().toISOString().split('T')[0];
            const eskiTutar = m ? (m.toplam / (m.miktar || 1)) : '';

            showModal(`
                <h3 class="text-2xl font-bold mb-6 border-b dark:border-slate-700 pb-2">${id ? 'Masrafı Düzenle' : 'Yeni Masraf Ekle'}</h3>
                <div class="space-y-4">
                    <input type="date" id="ms_tarih" value="${bugun}" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors font-medium">
                    <input type="text" id="ms_aciklama" value="${m ? m.aciklama : ''}" placeholder="Masraf Açıklaması (Örn: Kira, Elektrik)" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors font-bold">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="text-xs text-gray-500 mb-1 block">Miktar</label>
                            <input type="number" id="ms_miktar" value="${m ? (m.miktar || 1) : 1}" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors text-center font-bold" oninput="calcMasraf()">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 mb-1 block">Birim</label>
                            <input type="text" id="ms_birim" value="${m ? (m.birim || 'Adet') : 'Adet'}" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors text-center">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 mb-1 block">Birim Tutar</label>
                            <input type="number" id="ms_tutar" value="${eskiTutar}" placeholder="0.00" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors font-bold text-brand" oninput="calcMasraf()">
                        </div>
                    </div>
                    <div class="bg-gray-100 dark:bg-slate-800 p-4 rounded-xl text-right font-black text-2xl">
                        Genel Toplam: <span id="ms_toplam_txt" class="text-red-500">${m ? (m.toplam || 0).toFixed(2) : '0.00'}</span> ₺
                    </div>
                    <select id="ms_odemeTuru" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 shadow-inner outline-none focus:ring-2 focus:ring-brand transition-colors font-bold">
                        <option value="Nakit" ${m && m.odemeTuru === 'Nakit' ? 'selected' : ''}>Nakit</option>
                        <option value="Kredi Kartı" ${m && m.odemeTuru === 'Kredi Kartı' ? 'selected' : ''}>Kredi Kartı</option>
                        <option value="Havale/EFT" ${m && m.odemeTuru === 'Havale/EFT' ? 'selected' : ''}>Havale / EFT</option>
                        <option value="Çek" ${m && m.odemeTuru === 'Çek' ? 'selected' : ''}>Çek</option>
                    </select>
                    <div class="flex flex-col sm:flex-row gap-3 pt-4 border-t dark:border-slate-700">
                        <button onclick="closeModal()" class="w-full sm:flex-1 bg-gray-200 dark:bg-slate-700 py-3 rounded-xl font-bold order-2 sm:order-1">İptal</button>
                        <button onclick="saveMasraf('${id || ''}')" class="w-full sm:flex-1 bg-brand text-white py-3 rounded-xl font-bold order-1 sm:order-2">Kaydet</button>
                    </div>
                </div>
            `);
        }

        function calcMasraf() {
            const miktar = parseFloat(document.getElementById('ms_miktar').value) || 1;
            const tutar = parseFloat(document.getElementById('ms_tutar').value) || 0;
            document.getElementById('ms_toplam_txt').innerText = (miktar * tutar).toFixed(2);
        }

        function saveMasraf(id) {
            const aciklama = document.getElementById('ms_aciklama').value.trim();
            if(!aciklama) { 
                showToast('Uyarı', 'Masraf açıklaması girmelisiniz.', 'error'); 
                return; 
            }
            
            const miktar = parseFloat(document.getElementById('ms_miktar').value) || 1;
            const birim = document.getElementById('ms_birim').value.trim() || 'Adet';
            const tutar = parseFloat(document.getElementById('ms_tutar').value) || 0;
            const toplam = miktar * tutar;
            const tarih = document.getElementById('ms_tarih').value;
            const odemeTuru = document.getElementById('ms_odemeTuru').value;

            if(!db.masraflar) db.masraflar = [];

            if(id) {
                const idx = db.masraflar.findIndex(x => x.id === id);
                if(idx !== -1) {
                    db.masraflar[idx] = { id, tarih, aciklama, miktar, birim, toplam, odemeTuru };
                }
            } else {
                db.masraflar.push({ id: Date.now().toString(), tarih, aciklama, miktar, birim, toplam, odemeTuru });
            }

            closeModal(); 
            saveDB(); 
            renderMasraflar(document.getElementById('mainContent'));
            showToast('Başarılı', id ? 'Masraf güncellendi.' : 'Masraf eklendi.', 'success');
        }

        function deleteMasraf(id) {
            showCustomConfirm('Masrafı Sil', 'Emin misiniz?', () => {
                db.masraflar = db.masraflar.filter(x => x.id !== id);
                saveDB(); 
                renderMasraflar(document.getElementById('mainContent'));
                showToast('Bilgi', 'Masraf silindi.', 'info');
            });
        }

        // --- TEKLİFLER MODÜLÜ ---

                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;

            const query = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('teklifListContainer');
            if(container) {
                Array.from(container.children).forEach(card => {
                    const title = card.querySelector('.font-bold.text-lg')?.innerText.toLowerCase() || '';
                    card.style.display = title.includes(query) ? 'flex' : 'none';
                });
            }
        }

                            </div>

            kalemlerHtml += `</table></div>`;

                <div class="bg-white dark:bg-cardDark p-6 rounded-2xl shadow-sm mb-6">
                    <div class="flex flex-col md:flex-row justify-between items-start border-b dark:border-slate-700 pb-4 mb-4 gap-4">
                        <h2 class="text-3xl font-bold text-brand break-words">${t.musteri}</h2>
                        <div class="text-sm font-bold text-gray-500 bg-gray-100 dark:bg-slate-800 px-4 py-2 rounded-lg whitespace-nowrap">Tarih: ${t.tarih}</div>

                        <div class="bg-gray-50 dark:bg-slate-800/50 p-5 rounded-xl border border-gray-100 dark:border-slate-700">

                    </div>
                    ${kalemlerHtml}
